[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abnormality-detection-aws"
version = "0.1.0"
description = "Classification and triage of abnormalities in capsule-endoscopy images, redesigned as an end-to-end ML solution for Amazon SageMaker and Amazon Bedrock."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Samsom Yebio" }]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.0",
  "pillow>=9.5",
  "torch>=2.0",
  "torchvision>=0.15",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
aws = ["boto3>=1.34", "sagemaker>=2.200,<3"]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=7.4", "httpx>=0.27", "ruff>=0.4", "fastapi>=0.110", "uvicorn>=0.27", "boto3>=1.34", "onnx>=1.15"]

[project.scripts]
abnormality-detection = "abnormality_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
